name: Deploy to GitHub Pages

# デプロイのきっかけ
# - main への push（手元からの変更）
# - Fetch YouTube Data がデータを更新したとき（workflow_dispatch で呼ばれる）
# - 手動実行
# ※ GITHUB_TOKEN による push では push イベントが発火しないため、
#   データ更新後のデプロイは Fetch YouTube Data から明示的に呼び出している
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 公開するのはサイトに必要なファイルだけ（作業メモや README は公開しない）
      - name: Build site directory
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js style.css sitemap.xml robots.txt _site/
          cp -r data img _site/

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
