name: Fetch YouTube Data

on:
  schedule:
    # 30分ごとに実行（毎時7分・37分。UTC基準）
    # 毎時0分・30分は GitHub の混雑で遅延・スキップされやすいため、分をずらしている
    # APIクォータ節約のため search.list は配信予定の1回のみ使用（1回の実行で約110ユニット）
    - cron: '7,37 * * * *'
  workflow_dispatch: # 手動実行も可能

# 定期実行と手動実行が重なっても、同時には動かさない（順番に実行する）
concurrency:
  group: fetch-youtube
  cancel-in-progress: false

permissions:
  contents: write  # data/videos.json のコミット
  actions: write   # データ更新後に Deploy を呼び出す

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          API_KEY = os.environ['YOUTUBE_API_KEY']
          API = 'https://www.googleapis.com/youtube/v3'

          def api_get(endpoint, **params):
              """YouTube Data API を呼び出す。
              エラー（上限超え・キー不正・通信失敗など）のときは内容を表示して処理を止める。
              URL にはAPIキーが含まれるため、URL は表示しない。"""
              params['key'] = API_KEY
              url = f"{API}/{endpoint}?{urllib.parse.urlencode(params)}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as res:
                      data = json.loads(res.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  try:
                      msg = json.loads(e.read().decode('utf-8', 'replace')).get('error', {}).get('message', '')
                  except Exception:
                      msg = ''
                  sys.exit(f"YouTube API error: {endpoint} HTTP {e.code} {msg}")
              except urllib.error.URLError as e:
                  sys.exit(f"YouTube API connection error: {endpoint} {e.reason}")
              if 'error' in data:
                  sys.exit(f"YouTube API error: {endpoint} {data['error'].get('message', '')}")
              return data

          def thumbs_of(snippet, video_id):
              t = snippet.get('thumbnails', {})
              return (t.get('medium', {}).get('url') or f'https://i.ytimg.com/vi/{video_id}/mqdefault.jpg',
                      t.get('high', {}).get('url') or f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg')

          # ===== チャンネルID =====
          ch = api_get('channels', part='id', forHandle='god_hastia')
          if not ch.get('items'):
              sys.exit('channel not found: god_hastia')
          CHANNEL_ID = ch['items'][0]['id']
          print(f"Channel ID: {CHANNEL_ID}")

          # ===== 配信予定（search.list, 100ユニット）=====
          def parse_search_item(item):
              snippet = item.get('snippet', {})
              video_id = item.get('id', {}).get('videoId', '')
              if not video_id:
                  return None
              thumb, thumb_high = thumbs_of(snippet, video_id)
              return {
                  'id': video_id,
                  'title': snippet.get('title', ''),
                  'publishedAt': snippet.get('publishedAt', ''),
                  'scheduledStartTime': '',  # 後で videos API で補完
                  'thumbnail': thumb,
                  'thumbnailHigh': thumb_high,
                  'liveBroadcastContent': snippet.get('liveBroadcastContent', 'none'),
                  'category': 'upcoming',
                  'url': f'https://www.youtube.com/watch?v={video_id}',
              }

          upcoming_raw = api_get('search', part='snippet', channelId=CHANNEL_ID, eventType='upcoming',
                                 type='video', maxResults=50, order='date')
          upcoming = [x for x in (parse_search_item(i) for i in upcoming_raw.get('items', [])) if x]

          # ===== アップロード一覧（playlistItems, 1ページ1ユニット、最新150件まで）=====
          # 配信済み・通常動画・ショートを含む
          def fetch_uploads(max_pages=3):
              playlist_id = 'UU' + CHANNEL_ID[2:]
              items, token = [], ''
              for _ in range(max_pages):
                  params = dict(part='snippet,contentDetails', playlistId=playlist_id, maxResults=50)
                  if token:
                      params['pageToken'] = token
                  data = api_get('playlistItems', **params)
                  items += data.get('items', [])
                  token = data.get('nextPageToken', '')
                  if not token:
                      break
              return items

          def parse_playlist_item(item):
              snippet = item.get('snippet', {})
              cd = item.get('contentDetails', {})
              video_id = cd.get('videoId') or snippet.get('resourceId', {}).get('videoId', '')
              title = snippet.get('title', '')
              if not video_id or title in ('Private video', 'Deleted video'):
                  return None
              thumb, thumb_high = thumbs_of(snippet, video_id)
              return {
                  'id': video_id,
                  'title': title,
                  'publishedAt': cd.get('videoPublishedAt') or snippet.get('publishedAt', ''),
                  'scheduledStartTime': '',
                  'thumbnail': thumb,
                  'thumbnailHigh': thumb_high,
                  'liveBroadcastContent': 'none',  # 後で videos API で補完
                  'category': 'video',
                  'url': f'https://www.youtube.com/watch?v={video_id}',
              }

          uploads = [x for x in (parse_playlist_item(i) for i in fetch_uploads()) if x]

          # ===== 前回データの配信予定・ライブ中を引き継ぐ =====
          # 配信開始後は search の upcoming に出なくなるため、状態を videos API で再確認する
          # サイトで使わない項目（description など）は引き継がない
          DROP_FIELDS = {'description', 'isMembersOnly', 'actualEndTime'}
          carried, carried_ids = [], set()
          try:
              with open('data/videos.json', encoding='utf-8') as f:
                  prev = json.load(f).get('items', [])
              for p in prev:
                  if p.get('liveBroadcastContent') in ('upcoming', 'live') and p.get('id'):
                      carried.append({k: v for k, v in p.items() if k not in DROP_FIELDS})
                      carried_ids.add(p['id'])
          except (OSError, ValueError) as e:
              print(f"previous data not loaded: {e}")

          # 重複排除（IDベース、優先順位: upcoming > 前回引き継ぎ > uploads）
          seen, all_items = set(), []
          for item in upcoming + carried + uploads:
              if item['id'] and item['id'] not in seen:
                  seen.add(item['id'])
                  all_items.append(item)

          # ===== videos API で配信状態・配信時刻を取得（50件ずつ）=====
          def batches(ids, size=50):
              for i in range(0, len(ids), size):
                  yield ids[i:i + size]

          details_map = {}
          for batch in batches([i['id'] for i in all_items]):
              vdata = api_get('videos', part='liveStreamingDetails,snippet', id=','.join(batch))
              for vitem in vdata.get('items', []):
                  lsd = vitem.get('liveStreamingDetails', {})
                  details_map[vitem.get('id', '')] = {
                      'liveBroadcastContent': vitem.get('snippet', {}).get('liveBroadcastContent', 'none'),
                      'scheduledStartTime':  lsd.get('scheduledStartTime', ''),
                      'actualStartTime':     lsd.get('actualStartTime', ''),
                  }

          # 前回から引き継いだ配信予定のうち、取得できなくなったもの（削除・非公開）は除外
          all_items = [i for i in all_items
                       if not (i['id'] in carried_ids and i['id'] not in details_map)]

          # 配信状態・カテゴリ・配信時刻を反映
          for item in all_items:
              d = details_map.get(item['id'], {})
              if d.get('liveBroadcastContent'):
                  item['liveBroadcastContent'] = d['liveBroadcastContent']
              lbc = item['liveBroadcastContent']
              if lbc == 'upcoming':
                  item['category'] = 'upcoming'
              elif lbc == 'live':
                  item['category'] = 'live'
              elif d.get('actualStartTime'):
                  item['category'] = 'archive'
              else:
                  item['category'] = 'video'

              if lbc == 'upcoming':
                  # 配信予定：scheduledStartTime を使用
                  item['scheduledStartTime'] = d.get('scheduledStartTime', '')
                  if item['scheduledStartTime']:
                      item['publishedAt'] = item['scheduledStartTime']
              else:
                  # ライブ中・アーカイブ：実際の開始時刻 > 予定時刻 > 公開日時 の優先順位
                  actual = d.get('actualStartTime', '')
                  sched  = d.get('scheduledStartTime', '')
                  item['scheduledStartTime'] = sched
                  item['actualStartTime']    = actual
                  if actual:
                      item['publishedAt'] = actual
                  elif sched:
                      item['publishedAt'] = sched

          # 予定時刻から24時間以上過ぎた「配信予定」は、開始されなかった古い枠として除外
          now = datetime.now(timezone.utc)
          def is_stale_upcoming(item):
              if item.get('liveBroadcastContent') != 'upcoming':
                  return False
              t = item.get('scheduledStartTime') or item.get('publishedAt') or ''
              try:
                  return datetime.fromisoformat(t.replace('Z', '+00:00')) < now - timedelta(hours=24)
              except ValueError:
                  return False
          all_items = [i for i in all_items if not is_stale_upcoming(i)]

          # ===== ショート判定 =====
          # URL に /shorts/ を含むもの、または動画の長さが60秒以下のもの
          for item in all_items:
              item['isShort'] = '/shorts/' in item.get('url', '')

          def parse_duration_seconds(duration):
              # ISO 8601 duration: PT1M30S, PT45S, PT2H など
              m = re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', duration or '')
              if not m:
                  return 0
              return int(m.group(1) or 0) * 3600 + int(m.group(2) or 0) * 60 + int(m.group(3) or 0)

          # 配信予定・ライブ中は長さが決まっていないので対象外
          duration_ids = [i['id'] for i in all_items
                          if i['liveBroadcastContent'] not in ('upcoming', 'live') and not i['isShort']]
          duration_map = {}
          for batch in batches(duration_ids):
              vdata = api_get('videos', part='contentDetails', id=','.join(batch))
              for vitem in vdata.get('items', []):
                  duration_map[vitem.get('id', '')] = parse_duration_seconds(
                      vitem.get('contentDetails', {}).get('duration', ''))

          for item in all_items:
              if 0 < duration_map.get(item['id'], 0) <= 60:
                  item['isShort'] = True

          result = {
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'items': all_items,
          }
          with open('data/videos.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Total: {len(all_items)} videos saved (upcoming={len(upcoming)}, uploads={len(uploads)}, carried={len(carried)}).")
          EOF

      - name: Commit and push if changed
        id: commit
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/videos.json
          if git diff --staged --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update YouTube data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # 手元からの push と重なっても失敗しないよう、最新を取り込んでから push する（最大3回）
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push failed (attempt $i), retrying..."
            sleep $((i * 10))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # データが変わったときだけサイトを再デプロイする
      # （GITHUB_TOKEN の push では Deploy の push トリガーが動かないため、明示的に呼び出す）
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
