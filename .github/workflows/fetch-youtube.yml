name: Fetch YouTube Data

on:
  schedule:
    # 30分ごとに実行（UTC基準）
    # APIクォータ節約のため search.list は配信予定の1回のみ使用
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          CHANNEL_ID=$(curl -s "https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=god_hastia&key=${YOUTUBE_API_KEY}" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['items'][0]['id'])")
          echo "Channel ID: $CHANNEL_ID"
          export CHANNEL_ID

          # 配信予定のみ search.list（100ユニット）で取得
          # アーカイブ・通常動画はアップロード一覧（playlistItems, 1ユニット）で取得（Python内）
          curl -s "https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=upcoming&type=video&maxResults=50&order=date&key=${YOUTUBE_API_KEY}" -o /tmp/upcoming.json

          python3 << 'EOF'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          import os

          API_KEY = os.environ['YOUTUBE_API_KEY']

          def load(path):
              with open(path) as f:
                  data = json.load(f)
              return data.get('items', [])

          def parse_item(item, category):
              snippet = item.get('snippet', {})
              vid_id = item.get('id', {})
              if isinstance(vid_id, dict):
                  video_id = vid_id.get('videoId', '')
              else:
                  video_id = str(vid_id)
              return {
                  'id': video_id,
                  'title': snippet.get('title', ''),
                  'description': snippet.get('description', ''),
                  'publishedAt': snippet.get('publishedAt', ''),
                  'scheduledStartTime': '',  # 後で videos API で補完
                  'thumbnail': snippet.get('thumbnails', {}).get('medium', {}).get('url', ''),
                  'thumbnailHigh': snippet.get('thumbnails', {}).get('high', {}).get('url', ''),
                  'liveBroadcastContent': snippet.get('liveBroadcastContent', 'none'),
                  'category': category,
                  'url': f'https://www.youtube.com/watch?v={video_id}'
              }

          # アップロード一覧（最新150件まで）。配信済み・通常動画・ショートを含む
          def fetch_uploads(max_pages=3):
              playlist_id = 'UU' + os.environ['CHANNEL_ID'][2:]
              result = []
              token = ''
              for _ in range(max_pages):
                  url = (
                      f"https://www.googleapis.com/youtube/v3/playlistItems"
                      f"?part=snippet,contentDetails&playlistId={playlist_id}"
                      f"&maxResults=50&key={API_KEY}"
                  )
                  if token:
                      url += f"&pageToken={token}"
                  data = json.loads(urllib.request.urlopen(url).read().decode())
                  result += data.get('items', [])
                  token = data.get('nextPageToken', '')
                  if not token:
                      break
              return result

          def parse_playlist_item(item):
              snippet = item.get('snippet', {})
              cd = item.get('contentDetails', {})
              video_id = cd.get('videoId') or snippet.get('resourceId', {}).get('videoId', '')
              title = snippet.get('title', '')
              if not video_id or title in ('Private video', 'Deleted video'):
                  return None
              thumbs = snippet.get('thumbnails', {})
              return {
                  'id': video_id,
                  'title': title,
                  'description': snippet.get('description', ''),
                  'publishedAt': cd.get('videoPublishedAt') or snippet.get('publishedAt', ''),
                  'scheduledStartTime': '',
                  'thumbnail': thumbs.get('medium', {}).get('url') or f'https://i.ytimg.com/vi/{video_id}/mqdefault.jpg',
                  'thumbnailHigh': thumbs.get('high', {}).get('url') or f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg',
                  'liveBroadcastContent': 'none',  # 後で videos API で補完
                  'category': 'video',
                  'url': f'https://www.youtube.com/watch?v={video_id}'
              }

          upcoming = [parse_item(i, 'upcoming') for i in load('/tmp/upcoming.json')]
          uploads  = [x for x in (parse_playlist_item(i) for i in fetch_uploads()) if x]

          # 前回データの配信予定・ライブ中を引き継ぐ
          # （配信開始後は search の upcoming に出なくなるため、状態を videos API で再確認する）
          carried_ids = set()
          carried = []
          try:
              with open('data/videos.json', encoding='utf-8') as f:
                  prev = json.load(f).get('items', [])
              for p in prev:
                  if p.get('liveBroadcastContent') in ('upcoming', 'live') and p.get('id'):
                      carried.append(p)
                      carried_ids.add(p['id'])
          except Exception as e:
              print(f"previous data not loaded: {e}")

          # 重複排除（IDベース、優先順位: upcoming > 前回引き継ぎ > uploads）
          seen = set()
          all_items = []
          for item in upcoming + carried + uploads:
              if item['id'] and item['id'] not in seen:
                  seen.add(item['id'])
                  all_items.append(item)

          # ===== videos API で liveStreamingDetails + status を取得 =====
          # 全動画対象にする
          live_ids = [i['id'] for i in all_items if i['id']]

          # 50件ずつバッチ処理
          details_map = {}
          for batch_start in range(0, len(live_ids), 50):
              batch = live_ids[batch_start:batch_start+50]
              ids_param = ','.join(batch)
              url = (
                  f"https://www.googleapis.com/youtube/v3/videos"
                  f"?part=liveStreamingDetails,snippet,status"
                  f"&id={urllib.parse.quote(ids_param)}"
                  f"&key={API_KEY}"
              )
              req = urllib.request.urlopen(url)
              vdata = json.loads(req.read().decode())
              for vitem in vdata.get('items', []):
                  vid = vitem.get('id', '')
                  lsd = vitem.get('liveStreamingDetails', {})
                  status = vitem.get('status', {})
                  # メンバーシップ限定：privacyStatus が 'unlisted' かつ membersOnly
                  # YouTube API では membersOnly は直接フィールドとして返ってこないが、
                  # 一般的に membersOnly 動画は privacyStatus='members' または
                  # contentDetails に membersOnly フラグがある場合がある
                  privacy = status.get('privacyStatus', '')
                  is_members = privacy == 'members'
                  details_map[vid] = {
                      'liveBroadcastContent': vitem.get('snippet', {}).get('liveBroadcastContent', 'none'),
                      'scheduledStartTime':  lsd.get('scheduledStartTime', ''),
                      'actualStartTime':     lsd.get('actualStartTime', ''),
                      'actualEndTime':       lsd.get('actualEndTime', ''),
                      'isMembersOnly':       is_members,
                  }

          # 前回から引き継いだ配信予定のうち、取得できなくなったもの（削除・非公開）は除外
          all_items = [i for i in all_items
                       if not (i['id'] in carried_ids and i['id'] not in details_map)]

          # all_items に配信時刻を反映
          for item in all_items:
              d = details_map.get(item['id'], {})
              # videos API の最新状態で配信状態とカテゴリを更新
              if d.get('liveBroadcastContent'):
                  item['liveBroadcastContent'] = d['liveBroadcastContent']
              lbc = item['liveBroadcastContent']
              if lbc == 'upcoming':
                  item['category'] = 'upcoming'
              elif lbc == 'live':
                  item['category'] = 'live'
              elif d.get('actualStartTime'):
                  item['category'] = 'archive'
              else:
                  item['category'] = 'video'
              if lbc == 'upcoming':
                  # 配信予定：scheduledStartTime を使用
                  item['scheduledStartTime'] = d.get('scheduledStartTime', '')
                  if item['scheduledStartTime']:
                      item['publishedAt'] = item['scheduledStartTime']
              elif lbc in ('live', 'completed', 'none'):
                  # ライブ中・アーカイブ・通常ライブ：実際の開始時刻 > 予定時刻 の優先順位
                  actual = d.get('actualStartTime', '')
                  sched  = d.get('scheduledStartTime', '')
                  item['scheduledStartTime'] = sched
                  item['actualStartTime']    = actual
                  # publishedAt を配信開始時刻で上書き（actualStartTime優先、なければsched）
                  if actual:
                      item['publishedAt'] = actual
                  elif sched:
                      item['publishedAt'] = sched
                  # どちらもなければ publishedAt のまま（元の公開日時）
              # メンバーシップ限定フラグ（contentRating.ytRating == "ytAgeRestricted" ではなく
              # statusの madeForKids とは別。membersOnly は status.privacyStatus で判断できないが
              # liveStreamingDetails に isLowLatencyStream が含まれる場合がある。
              # 実際には membersOnly 動画は search API では返らないことが多いが、
              # 取得できた場合に備えて snippet.liveBroadcastContent や contentRating で判定）
              # → videos API の snippet.thumbnails が members限定の場合 "hqdefault" がブロックされることがある
              # ここでは title / description でのキーワード判定はフロント側に任せ、
              # status.embeddable == False の動画をメン限候補としてフラグ付け
              status_data = details_map.get(item['id'], {})
              if status_data.get('isMembersOnly', False):
                  item['isMembersOnly'] = True
              else:
                  item['isMembersOnly'] = False


          # ショートURL判定（/shorts/ を含むものはショートとして記録）
          # さらに contentDetails で duration が60秒以下のものもショートとして記録
          short_ids_from_url = set()
          for item in all_items:
              if '/shorts/' in item.get('url', ''):
                  item['isShort'] = True
                  short_ids_from_url.add(item['id'])
              else:
                  item['isShort'] = False

          # contentDetails で duration を取得してショート判定を補完
          # ライブ系以外の動画IDを対象に
          non_live_ids = [i['id'] for i in all_items 
                         if i['liveBroadcastContent'] not in ('upcoming','live','completed') 
                         and i['id'] and not i.get('isShort')]

          import re
          def parse_duration_seconds(duration):
              # ISO 8601 duration: PT1M30S, PT45S, PT2H etc.
              match = re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', duration or '')
              if not match:
                  return 0
              h = int(match.group(1) or 0)
              m = int(match.group(2) or 0)
              s = int(match.group(3) or 0)
              return h * 3600 + m * 60 + s

          duration_map = {}
          for batch_start in range(0, len(non_live_ids), 50):
              batch = non_live_ids[batch_start:batch_start+50]
              ids_param = ','.join(batch)
              url = (
                  f"https://www.googleapis.com/youtube/v3/videos"
                  f"?part=contentDetails"
                  f"&id={urllib.parse.quote(ids_param)}"
                  f"&key={API_KEY}"
              )
              req = urllib.request.urlopen(url)
              vdata = json.loads(req.read().decode())
              for vitem in vdata.get('items', []):
                  vid = vitem.get('id', '')
                  duration = vitem.get('contentDetails', {}).get('duration', '')
                  duration_map[vid] = parse_duration_seconds(duration)

          # 60秒以下はショートとしてマーク
          for item in all_items:
              if item['id'] in duration_map:
                  if duration_map[item['id']] <= 60:
                      item['isShort'] = True

          result = {
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'items': all_items
          }

          with open('data/videos.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"Total: {len(all_items)} videos saved.")
          print(f"Live details fetched: {len(details_map)} items.")
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/videos.json
          git diff --staged --quiet || git commit -m "chore: update YouTube data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
