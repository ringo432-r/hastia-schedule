<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title">
        <h1>はすてぃあ <span class="subtitle">配信スケジュール</span></h1>
        <p class="unofficial">非公式ファンサイト</p>
      </div>
      <a class="yt-link" href="https://www.youtube.com/@god_hastia" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTubeチャンネル
      </a>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="upcoming">📅 配信予定</button>
    <button class="tab-btn" data-tab="live">🔴 ライブ中</button>
    <button class="tab-btn" data-tab="archive">📼 アーカイブ</button>
    <button class="tab-btn" data-tab="video">🎬 動画</button>
    <button class="tab-btn" data-tab="short">▶ ショート</button>
  </nav>

  <main class="main-content">
    <div class="updated-info">
      <span id="updatedAt">読み込み中...</span>
    </div>

    <div id="tab-upcoming" class="tab-content active">
      <div class="section-header">
        <h2>📅 配信予定</h2>
      </div>
      <div id="list-upcoming" class="card-grid"></div>
    </div>

    <div id="tab-live" class="tab-content">
      <div class="section-header">
        <h2>🔴 ライブ中</h2>
      </div>
      <div id="list-live" class="card-grid"></div>
    </div>

    <div id="tab-archive" class="tab-content">
      <div class="section-header">
        <h2>📼 配信アーカイブ</h2>
      </div>
      <div id="list-archive" class="card-grid"></div>
    </div>

    <div id="tab-video" class="tab-content">
      <div class="section-header">
        <h2>🎬 動画</h2>
      </div>
      <div id="list-video" class="card-grid"></div>
    </div>

    <div id="tab-short" class="tab-content">
      <div class="section-header">
        <h2>▶ ショート</h2>
      </div>
      <div id="list-short" class="card-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>このサイトは非公式のファンサイトです。はすてぃあ様とは無関係です。</p>
    <p>データは <a href="https://www.youtube.com/@god_hastia" target="_blank" rel="noopener">YouTube チャンネル</a> より取得しています。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
