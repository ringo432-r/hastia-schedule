<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>はすてぃあ 配信スケジュール</title>
  <meta name="description" content="VTuber はすてぃあ様の配信予定・アーカイブをまとめた非公式スケジュールサイト" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-title">はすてぃあ<br>ポータル</div>
      <div class="logo-sub">非公式</div>
    </div>
    <div class="next-stream">
      <div class="next-label">次の配信</div>
      <div id="next-stream-info">読み込み中...</div>
    </div>
    <nav class="sidebar-links">
      <a href="https://www.youtube.com/@god_hastia" target="_blank" rel="noopener" class="sidebar-btn yt">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTubeチャンネル
      </a>
    </nav>
    <div class="sidebar-note">時刻はすべて日本時間</div>
  </aside>

  <!-- メインエリア -->
  <div class="main-wrapper">
    <!-- タブ -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="timetable">番組表</button>
      <button class="tab-btn" data-tab="calendar">カレンダー</button>
      <button class="tab-btn" data-tab="archive">アーカイブ</button>
    </nav>

    <div class="tab-panels">

      <!-- ===== 番組表タブ ===== -->
      <div id="tab-timetable" class="tab-panel active">
        <div class="panel-header">番組表</div>
        <div class="timetable-controls">
          <button id="tt-prev" class="nav-btn">◀ 前の週</button>
          <div class="tt-week-label">
            <span id="tt-week-range"></span>
            <button id="tt-today" class="today-btn">今週へ戻る</button>
          </div>
          <button id="tt-next" class="nav-btn">次の週 ▶</button>
        </div>
        <div class="timetable-scroll">
          <table class="timetable" id="timetable"></table>
        </div>
      </div>

      <!-- ===== カレンダータブ ===== -->
      <div id="tab-calendar" class="tab-panel">
        <div class="panel-header">カレンダー</div>
        <div class="calendar-controls">
          <button id="cal-prev" class="nav-btn">◀ 前の月</button>
          <span id="cal-month-label"></span>
          <button id="cal-next" class="nav-btn">次の月 ▶</button>
        </div>
        <div class="calendar-grid-wrap">
          <table class="calendar-table" id="calendar"></table>
        </div>
      </div>

      <!-- ===== アーカイブタブ ===== -->
      <div id="tab-archive" class="tab-panel">
        <div class="panel-header">アーカイブ</div>
        <div class="archive-filter" id="archive-filter"></div>
        <div class="archive-search-row">
          <input type="text" id="archive-search" placeholder="タイトルで検索" class="archive-search" />
          <span id="archive-count" class="archive-count"></span>
        </div>
        <div id="archive-list" class="archive-list"></div>
      </div>

    </div><!-- /tab-panels -->

    <div class="updated-bar">
      最終更新: <span id="updatedAt">読み込み中...</span>
    </div>

    <footer class="site-footer">
      非公式のファンサイトです。運営は本人・事務所とは関係ありません。予定は変更されることがあります。<br>
      <a href="https://www.youtube.com/@god_hastia" target="_blank" rel="noopener">YouTube（公式）</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
